name: Report a bug
description: Something broken in the app or in one of the built-in cartridges.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This is a hobby project, so reports may not get a reply or a fix, but they are read when time allows.

        Bugs in a game an AI model made (a remix) are usually the model's doing. Those are only worth reporting if the app itself misbehaves.
        Never paste your API key here.

  - type: input
    id: cartridge
    attributes:
      label: Cartridge or area
      description: Which cartridge (e.g. SNAKE), or which part of the app (3D desk, remix screen, results, settings, export).
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Paste any error text.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put SNAKE in slot A
        2. Press START
        3. ...
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on Windows 11
    validations:
      required: true

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot or recording (optional)
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
